name: Deploy Completo (Backend + Frontend Separados)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Deploy Backend (App Core)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: repertorio-app/
          # Mantem estado de sincronizacao para enviar apenas arquivos alterados.
          state-name: .ftp-state-backend.json
          dangerous-clean-slate: false
          exclude: |
            public/**
            .git*
            .github/**
            tests/**
            storage/*.key
            .env
            README.md

      - name: Deploy Frontend (Public Folder)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: repertorio.websiteponto.com.br/
          # Estado separado do backend para comparacao correta de alteracoes.
          state-name: .ftp-state-frontend.json
          dangerous-clean-slate: false
          exclude: |
            index.php

      - name: Trigger Database Migrations
        run: curl "https://repertorio.websiteponto.com.br/rodar-migrations-secreto?key=123456"
